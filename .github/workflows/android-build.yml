name: Build Android Bridge APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x hermes-android-bridge/gradlew

    - name: Build with Gradle
      run: cd hermes-android-bridge && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hermes-bridge-app
        path: hermes-android-bridge/app/build/outputs/apk/debug/app-debug.apk
